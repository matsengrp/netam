# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # setuptools-scm derives the version from git tags; without full history
        # and tags it falls back to 0.0.x and uploads a bogus wheel to PyPI.
        fetch-depth: 0
        fetch-tags: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Verify built version matches release tag
      run: |
        tag="${GITHUB_REF_NAME#v}"
        built=$(ls dist/netam-*.tar.gz | sed -E 's|.*/netam-(.*)\.tar\.gz|\1|')
        echo "Release tag: ${GITHUB_REF_NAME} (stripped: ${tag})"
        echo "Built version: ${built}"
        if [ "${built}" != "${tag}" ]; then
          echo "::error::Built version ${built} does not match release tag ${tag}; refusing to publish."
          exit 1
        fi
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_TOKEN }}
